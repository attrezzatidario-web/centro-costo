<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17366d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presenze">
<meta name="referrer" content="no-referrer">
<title>Presenze</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="presenze.css?v=128">
</head>
<body>
  <!-- accesso -->
  <section id="pz-login" class="pz-auth" hidden>
    <div class="pz-auth-card">
      <div class="pz-brand"><img src="../logo.svg" alt="" width="44" height="44"><div><b>Presenze</b><span>Timbrature, ferie e permessi</span></div></div>
      <form id="pz-lf" autocomplete="on">
        <label class="pz-f"><span>Email o nome utente</span><input id="pz-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="mario.rossi"></label>
        <label class="pz-f"><span>Password</span><input id="pz-pw" name="password" type="password" autocomplete="current-password" required></label>
        <p class="pz-err" id="pz-lerr" role="alert"></p>
        <button type="submit" class="pz-btn primary wide" id="pz-lgo">Entra</button>
      </form>
      <p class="pz-hint">Le credenziali te le dà il titolare. Se le hai dimenticate chiedigli una nuova password.</p>
    </div>
  </section>

  <!-- cambio password al primo accesso -->
  <section id="pz-pwset" class="pz-auth" hidden>
    <div class="pz-auth-card">
      <div class="pz-brand"><img src="../logo.svg" alt="" width="44" height="44"><div><b>Scegli la tua password</b><span>La password provvisoria va cambiata al primo accesso</span></div></div>
      <form id="pz-pf">
        <label class="pz-f"><span>Password provvisoria</span><input name="old" type="password" autocomplete="current-password" required></label>
        <label class="pz-f"><span>Nuova password (almeno 8 caratteri)</span><input name="n1" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="pz-f"><span>Ripeti la nuova password</span><input name="n2" type="password" autocomplete="new-password" minlength="8" required></label>
        <p class="pz-err" id="pz-perr" role="alert"></p>
        <button type="submit" class="pz-btn primary wide">Salva e continua</button>
      </form>
    </div>
  </section>

  <!-- app -->
  <div id="pz-app" hidden>
    <header class="pz-top">
      <div class="pz-who"><span class="pz-av" id="pz-av"></span><div><b id="pz-name"></b><small id="pz-org"></small></div></div>
      <button type="button" class="pz-ib" id="pz-menu" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </header>
    <div class="pz-demo" id="pz-demo" hidden>Versione demo: le timbrature restano solo su questo dispositivo</div>
    <main id="pz-main"></main>
    <nav class="pz-tabs" role="tablist">
      <button type="button" data-tab="oggi" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Oggi</span></button>
      <button type="button" data-tab="storico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Storico</span></button>
      <button type="button" data-tab="richieste"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 16l3-9 3 6 3-4 3 7"/></svg><span>Ferie e permessi</span><em id="pz-badge" hidden></em></button>
    </nav>
  </div>

  <div class="pz-sheet" id="pz-sheet" hidden><div class="pz-sheet-bg" data-close></div><div class="pz-sheet-p" role="dialog" aria-modal="true"><div class="pz-sheet-h"><b id="pz-sh-t"></b><button type="button" class="pz-ib" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="pz-sh-b"></div></div></div>
  <div class="pz-toast" id="pz-toast" role="status" hidden></div>
  <div class="pz-boot" id="pz-boot"><div class="pz-spin"></div></div>

  <script src="presenze.js?v=128"></script>
</body>
</html>
